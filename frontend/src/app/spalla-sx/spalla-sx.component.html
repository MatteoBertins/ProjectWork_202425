<nav class="sidebar" aria-label="Navigazione principale">
  <h1>FinInvest Bank</h1>

  <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeSottoMenu()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z"/></svg>
    Home
  </a>

  <a routerLink="/investimenti" routerLinkActive="active" (click)="closeSottoMenu()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17h16M4 12h16M4 7h16"/></svg>
    Investimenti
  </a>

  <div class="submenu-group">
    <a  (click)="clickSottoMenuFinanziamenti()" [class.active]="sottoMenuFinanziamenti"
    routerLinkActive="active" >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18m9-9H3"/></svg>
      Finanziamenti
      <span class="arrow" >▾</span>
    </a>

    <div class="submenu" *ngIf="sottoMenuFinanziamenti">
      <a routerLink="/finanziamenti/prestiti" routerLinkActive="active">Prestiti</a>
      <a routerLink="/finanziamenti/mutui" routerLinkActive="active">Mutui</a>
    </div>
  </div>


  <div class="submenu-group">
    <a  (click)="clickSottoMenuContoDeposito()" [class.active]="sottoMenuContoDeposito"
    routerLinkActive="active" >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18m9-9H3"/></svg>
      Conto Deposito
      <span class="arrow" >▾</span>
    </a>

    <div class="submenu" *ngIf="sottoMenuContoDeposito">
      <a routerLink="/conto-deposito/simulazione" routerLinkActive="active">Simulazione</a>
      <a routerLink="/conto-deposito/vincola" routerLinkActive="active">Vincola</a>
    </div>
  </div>
</nav>
