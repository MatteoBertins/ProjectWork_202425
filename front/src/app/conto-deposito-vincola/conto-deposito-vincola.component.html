<div class="layout">
  <app-spalla-sx></app-spalla-sx>

  <div class="main-content">
    
    <div class="card">
      <h2>Vincolo Conto Deposito</h2>
       <section class="balance-card" aria-label="Saldo corrente del conto">
    <span>Saldo disponibile</span>
    <span id="saldo">{{saldoDisponibile| currency : 'EUR'}}</span>
  </section>
      <form id="vincolo-form" [formGroup]="formConto">
        <label for="importo-vincolo">Importo da vincolare (€)</label>
        <input
          type="number"
          id="importo-vincolo"
          name="importo-vincolo"
          min="1"
          step="0.01"
          required
          formControlName="importoDaVincolare"
          placeholder="Inserisci importo"
        />

        <label for="durata-vincolo">Durata vincolo (mesi)</label>
        <select id="durata-vincolo" name="durata-vincolo" formControlName="durata" required>
          <option value="" disabled selected>Seleziona durata</option>
          <option value="6">6 mesi</option>
          <option value="12">12 mesi</option>
          <option value="24">24 mesi</option>
        </select>

        <label for="tasso-vincolo">Tasso d’interesse annuo (%)</label>
        <input
          type="number"
          id="tasso-vincolo"
          name="tasso-vincolo"
          value="2"
          disabled
          readonly
        />

        <button type="submit" (click)="vincolaDeposito()">Vincola Importo</button>
      </form>

      <div id="vincolo-msg" class="result" style="display:none;"></div>
    </div>
  </div>
</div>
